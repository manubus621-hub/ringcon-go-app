<style>
:root{
  --bg:#fff;--ink:#141416;--mute:#75757d;--line:#ececf0;--soft:#f5f5f7;
  --brand:#ff3b1f;--brand-d:#e32d12;--ok:#12a863;--warn:#f08c00;--bad:#e5384b;
  --r:20px;--shadow:0 12px 32px -14px rgba(20,20,22,.3);
  --display:'Bricolage Grotesque',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font:16px/1.45 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:inherit}
h1,h2,h3,.logo{font-family:var(--display);letter-spacing:-.025em}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.logo{font-weight:800;font-size:24px;line-height:1}
.logo b{background:var(--brand);color:#fff;border-radius:9px;padding:1px 8px 3px;margin-left:4px;display:inline-block;transform:rotate(-5deg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:14px;font-weight:700;transition:transform .12s,background .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--brand);color:#fff;box-shadow:0 12px 24px -12px var(--brand)}
.btn.primary:hover{background:var(--brand-d)}
.btn.ghost{background:var(--soft)}
.btn.big{width:100%;padding:16px;font-size:17px;border-radius:16px}
.btn[disabled]{opacity:.5;pointer-events:none}
.icon-btn{width:40px;height:40px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:18px;flex:none}
.link{color:var(--brand);font-weight:700}
.hide{display:none!important}

/* login */
.login{min-height:100dvh;display:grid;place-items:center;padding:24px}
.login-box{max-width:360px;width:100%;text-align:center}
.login-box .ico{width:76px;height:76px;display:block;margin:0 auto 22px}
.login-box h1{font-size:30px;line-height:1.1;margin:0 0 6px;font-weight:800}
.login-box .field{text-align:left}
@keyframes bob{50%{transform:translateY(-12px) rotate(-3deg)}}
.sub{color:var(--mute);margin-bottom:24px}
.field{display:block;margin-bottom:14px;font-size:13px;font-weight:600;color:var(--mute)}
.field i{font-weight:400;font-style:normal}
.field input{display:block;width:100%;margin-top:6px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--soft);font-size:16px;outline:0;transition:border-color .2s,background .2s}
.field input:focus{border-color:var(--ink);background:#fff}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12px;color:var(--mute);margin:-4px 0 12px}

/* header */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.top .logo{font-size:19px}
.top-title{flex:1;font-family:var(--display);font-size:18px}
.addr{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;padding:6px 14px;border-radius:14px;background:var(--soft)}
.addr>span:nth-child(2){min-width:0;flex:1}
.addr small{display:block;font-size:11px;color:var(--mute);font-weight:600}
.addr strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--ink);color:#fff;font-weight:800;font-family:var(--display);flex:none}
@media(max-width:520px){.top .logo{display:none}}

/* home */
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 150px}
.wrap.narrow{max-width:680px}
.hello{color:var(--mute);font-weight:600}
.hello b{color:var(--ink)}
.hero h1{font-size:clamp(34px,7vw,64px);font-weight:800;line-height:1;margin:8px 0 18px;max-width:14ch}
.search{position:relative}
.search::before{content:'🔎';position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:16px}
.search input{width:100%;padding:16px 18px 16px 46px;border-radius:16px;border:1.5px solid var(--line);background:var(--soft);outline:0;font-size:16px}
.search input:focus{border-color:var(--ink);background:#fff}
.livep{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14px;font-weight:600;color:var(--mute)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);display:inline-block;position:relative;flex:none}
.dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--ok);animation:ping 1.6s infinite}
@keyframes ping{to{transform:scale(3.2);opacity:0}}
.dot.off{background:#bdbdc4}.dot.off::after{display:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:16px 0 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 16px;border-radius:999px;background:var(--soft);font-weight:700;font-size:14px}
.chip.on{background:var(--ink);color:#fff}
.promo{display:flex;gap:14px;align-items:center;padding:18px;border-radius:var(--r);background:var(--brand);color:#fff;margin:18px 0 0;width:100%;text-align:left}
.promo .em{font-size:34px}
.promo b{display:block;font-family:var(--display);font-size:20px;line-height:1.1}
.promo small{opacity:.85}
.promo .go{margin-left:auto;background:#fff;color:var(--brand);border-radius:12px;padding:9px 14px;font-weight:800;flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{text-align:left;border-radius:var(--r);overflow:hidden;background:#fff;border:1px solid var(--line);transition:transform .2s,box-shadow .2s;display:block;width:100%}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.tile{height:128px;display:grid;place-items:center;font-size:62px;background:var(--tile)}
.card-b{padding:14px 16px 16px}
.card-b h3{font-size:19px;font-weight:800}
.meta{display:flex;flex-wrap:wrap;gap:2px 12px;color:var(--mute);font-size:14px;margin-top:4px}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:40px 0}
.foot{text-align:center;color:var(--mute);font-size:12px;padding:34px 0 0}

/* business */
.biz-hero{height:190px;border-radius:var(--r);background:var(--tile);display:grid;place-items:center;font-size:96px;margin-bottom:16px}
.biz-name{font-size:36px;font-weight:800;line-height:1.05}
.menu{margin-top:14px}
.item{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.item .em{font-size:32px;width:60px;height:60px;border-radius:16px;background:var(--soft);display:grid;place-items:center;flex:none}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block}
.item .tx small{color:var(--mute);display:block;font-size:13px}
.item .pr{font-weight:800;margin-top:2px;display:block}
.add{width:38px;height:38px;border-radius:50%;background:var(--brand);color:#fff;font-size:22px;font-weight:700;line-height:1}
.qty{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:999px;padding:3px}
.qty button{width:32px;height:32px;border-radius:50%;background:#fff;font-weight:800;font-size:18px;box-shadow:0 1px 3px rgba(0,0,0,.14)}
.qty span{min-width:18px;text-align:center;font-weight:800}

/* dock */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));max-width:680px;margin:0 auto;pointer-events:none}
#dock>*{pointer-events:auto}
.bar{display:flex;align-items:center;gap:12px;padding:15px 18px;border-radius:18px;font-weight:800;box-shadow:var(--shadow);width:100%;text-align:left}
.bar.cart{background:var(--brand);color:#fff;justify-content:space-between}
.bar.cart .n{background:rgba(255,255,255,.25);border-radius:10px;padding:2px 10px}
.bar.trk{background:var(--ink);color:#fff}
.bar.trk small{display:block;font-weight:500;opacity:.7}
.bar.trk .go{margin-left:auto;background:var(--brand);border-radius:10px;padding:6px 12px}

/* sheet */
#sheet-root{position:fixed;inset:0;z-index:50;pointer-events:none}
#sheet-root.open{pointer-events:auto}
.scrim{position:absolute;inset:0;background:rgba(10,10,14,.5);opacity:0;transition:opacity .25s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92dvh;overflow:auto;background:#fff;border-radius:26px 26px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-width:560px;margin:0 auto}
#sheet-root.open .scrim{opacity:1}
#sheet-root.open .sheet{transform:none}
@media(min-width:700px){.sheet{bottom:auto;top:50%;border-radius:26px;transform:translateY(-40%) scale(.97);opacity:0;max-height:88dvh;transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .2s}#sheet-root.open .sheet{transform:translateY(-50%);opacity:1}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:12px}
.sheet-h h2{font-size:26px;font-weight:800;line-height:1.05}
.sheet h3{font-size:15px;margin:20px 0 8px}
.line{display:flex;align-items:center;gap:12px;padding:10px 0}
.line .tx{flex:1;min-width:0}
.co-addr{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--soft);margin:8px 0 14px}
.co-addr>div{flex:1;min-width:0}
.co-addr small{display:block;color:var(--mute);font-size:12px;font-weight:600}
.co-addr strong{display:block;font-size:14px}
.tips{display:flex;gap:8px;flex-wrap:wrap}
.pill{padding:10px 16px;border-radius:12px;background:var(--soft);font-weight:700;border:1.5px solid transparent}
.pill.on{border-color:var(--ink);background:#fff}
.methods{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.method{padding:14px;border-radius:16px;border:1.5px solid var(--line);text-align:left;font-weight:700}
.method.on{border-color:var(--brand);background:#fff5f3}
.method small{display:block;font-weight:500;color:var(--mute)}
.method.wide{grid-column:1/-1}
.pp-al{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 2px}
.pp-al b{font-size:18px;word-break:break-all}
.pp-al .btn{padding:8px 14px;flex:none}
#pp-form{margin-bottom:14px}
.tot{display:flex;justify-content:space-between;padding:4px 0;color:var(--mute)}
.tot.big{color:var(--ink);font-weight:800;font-size:20px;padding-top:12px;margin:8px 0 16px;border-top:1px dashed var(--line)}
.secure{text-align:center;color:var(--mute);font-size:12px;margin-top:12px}
.sug{display:grid;gap:4px;margin:-6px 0 12px}
.sug button{text-align:left;padding:10px 12px;border-radius:12px;background:var(--soft);font-size:14px}
.saved{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.saved .pill{font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* pago */
#pay{position:fixed;inset:0;z-index:80;background:rgba(255,255,255,.97);display:none;place-items:center;text-align:center;padding:24px}
#pay.on{display:grid}
.spin{width:64px;height:64px;border-radius:50%;border:6px solid var(--line);border-top-color:var(--brand);animation:sp .8s linear infinite;margin:0 auto 18px}
@keyframes sp{to{transform:rotate(360deg)}}
.okk{width:72px;height:72px;border-radius:50%;background:var(--ok);color:#fff;font-size:38px;display:grid;place-items:center;margin:0 auto 18px;animation:pop .4s}
@keyframes pop{from{transform:scale(.3)}}
#pay h2{font-size:26px}

/* tracking */
.t-head{padding:20px;border-radius:var(--r);background:var(--ink);color:#fff;margin-bottom:18px}
.t-head small{opacity:.7;display:block}
.t-head h1{font-size:30px;line-height:1.05;margin:8px 0 6px;font-weight:800}
.steps{margin:6px 0 18px}
.step{display:flex;gap:14px;align-items:flex-start;position:relative;padding-bottom:18px;color:var(--mute)}
.step::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--line)}
.step:last-child::before{display:none}
.step i{width:24px;height:24px;border-radius:50%;background:var(--line);flex:none;display:grid;place-items:center;font-style:normal;font-size:13px;color:#fff;z-index:1}
.step.done{color:var(--ink)}.step.done i{background:var(--ok)}.step.done::before{background:var(--ok)}
.step.now{color:var(--ink);font-weight:700}.step.now i{background:var(--brand);box-shadow:0 0 0 6px rgba(255,59,31,.18)}
.box{padding:16px;border-radius:var(--r);background:var(--soft);margin-bottom:14px}
.box.livep{margin-top:0}
.ord{display:block;width:100%;text-align:left}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:800}
.badge.ok{background:#dff6ea;color:#0b7a46}.badge.wait{background:#fff0d2;color:#955700}.badge.bad{background:#fde3e6;color:#b4232f}
.drv{display:flex;align-items:center;gap:14px}
.drv .av{width:48px;height:48px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;font-family:var(--display);font-size:20px}
.drv div{flex:1}
.drv small{color:var(--mute);display:block}
#toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-140%);z-index:90;background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;transition:transform .3s;max-width:92vw;box-shadow:var(--shadow)}
#toast.on{transform:translate(-50%,0)}
#toast.err{background:var(--bad)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#splash{position:fixed;inset:0;z-index:200;display:grid;place-content:center;justify-items:center;gap:18px;animation:spOut .45s ease 1.3s forwards}
#splash svg{width:96px;height:96px;animation:spIn .6s cubic-bezier(.2,.9,.3,1.2) both}
#splash p{font:800 15px var(--display);letter-spacing:.18em;text-transform:uppercase;animation:spIn .6s .15s both}
@keyframes spIn{from{transform:scale(.7);opacity:0}}
@keyframes spOut{to{opacity:0;visibility:hidden}}
@media(prefers-reduced-motion:reduce){#splash{display:none!important}}
#splash{background:#fff;color:var(--ink)}
/* minimalista */
.top{border-bottom:0;background:rgba(255,255,255,.85)}
.hero h1{font-size:clamp(32px,6vw,52px);letter-spacing:-.045em}
.search input{background:var(--soft);border-color:transparent}
.chip{background:transparent;border:1.5px solid var(--line);color:var(--mute)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.promo{background:var(--ink)}.promo .go{color:var(--ink)}
.card{border:0;background:var(--soft);box-shadow:none;border-radius:26px}
.card:hover{transform:none;box-shadow:none;background:#ececf0}
.tile{height:104px;font-size:50px;background:transparent}
.card-b{padding:4px 18px 18px}
.biz-hero{background:var(--soft);height:150px;font-size:76px}
.item .em{background:var(--soft)}
.bar.cart{box-shadow:none}
</style>
</head>

<div id="pay"><div><div class="spin" id="pay-i"></div><h2 id="pay-t"></h2><p class="sub" id="pay-s"></p></div></div>

<script>
/* JS app Rincón Go */
(() => {
'use strict';

/* ═══════════════ CONFIGURACIÓN ═══════════════
   FIREBASE_URL: URL de tu Firebase Realtime Database (la MISMA en la app de conductores).
   Vacío = modo demo local: solo sincroniza entre pestañas del mismo navegador.
   ROOM: nombre de tu "sala"; debe ser igual en ambos archivos. */
const CONFIG = {
  FIREBASE_URL: "https://ringcon-go-e7f62-default-rtdb.firebaseio.com",
  ROOM: "ringcon-go",
  CURRENCY: "$",
  /* Personal Pay: tu alias o CVU donde el cliente te transfiere desde la app. TITULAR es opcional.
     Si dejas ALIAS vacío, el cliente verá "los datos te los pasa el conductor". */
  PERSONAL_PAY: { ALIAS: "Braiantorres.ito", TITULAR: "" },
  RATE: 1500,              // pesos argentinos por unidad del catálogo original (ajústalo a gusto)
  DRIVER_TTL: 120000,      // un conductor cuenta como "en línea" si latió hace menos de 2 min
};

/* ═══════════════ SINCRONIZACIÓN EN TIEMPO REAL ═══════════════ */
const Sync = (() => {
  const remote = !!CONFIG.FIREBASE_URL;
  const base = remote ? CONFIG.FIREBASE_URL.replace(/\/+$/, '') + '/' + CONFIG.ROOM : '';
  const cols = ['orders', 'drivers'];
  const cache = { orders: {}, drivers: {} };
  const subs = { orders: new Set(), drivers: new Set() };
  const statusSubs = new Set();
  let status = remote ? 'connecting' : 'local';
  let done; const loaded = new Promise(r => (done = r));
  const key = c => `rcg:${CONFIG.ROOM}:${c}`;
  const bc = 'BroadcastChannel' in window ? new BroadcastChannel('rcg:' + CONFIG.ROOM) : null;
  const setStatus = s => { if (s !== status) { status = s; statusSubs.forEach(f => f(s)); } };
  const emit = c => subs[c].forEach(f => { try { f(cache[c]); } catch (e) { console.error(e); } });
  const readLocal = c => { try { return JSON.parse(localStorage.getItem(key(c)) || '{}') || {}; } catch { return {}; } };
  const refreshLocal = c => { cache[c] = readLocal(c); emit(c); };

  async function pull(c) {
    try {
      const r = await fetch(`${base}/${c}.json`, { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      cache[c] = (await r.json()) || {};
      setStatus('live'); emit(c);
    } catch (e) { setStatus('offline'); }
  }
  function start() {
    if (!remote) {
      cols.forEach(refreshLocal);
      if (bc) bc.onmessage = e => refreshLocal(e.data.c);
      addEventListener('storage', e => cols.forEach(c => { if (e.key === key(c)) refreshLocal(c); }));
      done(); return;
    }
    Promise.all(cols.map(pull)).then(done);
    cols.forEach(c => {
      try {
        const es = new EventSource(`${base}/${c}.json`);
        let t; const kick = () => { clearTimeout(t); t = setTimeout(() => pull(c), 120); };
        es.addEventListener('put', kick); es.addEventListener('patch', kick);
        es.onerror = () => setStatus('offline');
      } catch {}
    });
    setInterval(() => cols.forEach(pull), 8000);   // respaldo por si el stream se corta
  }
  async function patch(c, id, data) {
    if (!remote) {
      const all = readLocal(c); all[id] = Object.assign({}, all[id], data);
      try { localStorage.setItem(key(c), JSON.stringify(all)); } catch {}
      cache[c] = all; emit(c); if (bc) bc.postMessage({ c }); return;
    }
    cache[c][id] = Object.assign({}, cache[c][id], data); emit(c);
    const r = await fetch(`${base}/${c}/${id}.json`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data), keepalive: true });
    if (!r.ok) throw new Error('HTTP ' + r.status);
  }
  return {
    remote, loaded, start, patch,
    get: (c, id) => cache[c][id],
    refresh: c => remote ? pull(c) : Promise.resolve(refreshLocal(c)),
    subscribe(c, fn) { subs[c].add(fn); fn(cache[c]); },
    onStatus(fn) { statusSubs.add(fn); fn(status); },
    status: () => status
  };
})();

const $ = (s, el = document) => el.querySelector(s);

const cartCount = () => Object.values(state.cart.items).reduce((s, q) => s + q, 0);
function cartLines() {
  const b = biz(state.cart.bizId); if (!b) return [];
  return Object.entries(state.cart.items).filter(([, q]) => q > 0).map(([id, q]) => ({ ...b.menu.find(m => m.id === id), qty: q }));
}
function totals() {
  const b = biz(state.cart.bizId), lines = cartLines();
  const subtotal = lines.reduce((s, l) => s + l.price * l.qty, 0);
  const fee = b && lines.length ? b.fee : 0;
  const service = Math.round(subtotal * 0.15);
  const tip = lines.length ? state.tip : 0;
  return { subtotal: +subtotal.toFixed(2), fee, service, tip, total: +(subtotal + fee + service + tip).toFixed(2) };
}
function addItem(bizId, itemId, d) {
  if (d > 0 && cartCount() > 0 && state.cart.bizId !== bizId) {
    if (!confirm('Tu carrito tiene productos de otro local. ¿Vaciarlo y empezar este pedido?')) return false;
    state.cart = { bizId: null, items: {} };
  }
  if (!cartCount()) state.cart.bizId = bizId;
  const q = Math.max(0, (state.cart.items[itemId] || 0) + d);
  if (q) state.cart.items[itemId] = q; else delete state.cart.items[itemId];
  if (!cartCount()) state.cart.bizId = null;
  return true;
}
const code = o => o.id.slice(-5).toUpperCase();
const mine = () => Object.values(state.orders).filter(o => o.customer && o.customer.id === state.user.id).sort((a, b) => b.createdAt - a.createdAt);

const onlineDrivers = () => Object.values(state.drivers).filter(d => d.online && Date.now() - (d.lastSeen || 0) < CONFIG.DRIVER_TTL);

function statusInfo(o) {
  const d = o.driver ? o.driver.name : 'Tu conductor';
  switch (o.status) {
    case 'nuevo': return { t: 'Buscando conductor…', s: 'Tu pedido ya está en la app de conductores', i: 0 };
    case 'aceptado': return { t: `${d} va por tu pedido`, s: 'Va camino al local', i: 1 };
    case 'en_local': return { t: `${d} está en el local`, s: 'Recogiendo tu pedido', i: 1 };
    case 'recogido': return { t: '¡Tu pedido va en camino!', s: `${d} ya lo tiene`, i: 2 };
    case 'entregado': return { t: '¡Entregado! Buen provecho', s: 'Gracias por pedir con Ringcon Go', i: 3 };
    default: return { t: 'Pedido cancelado', s: '', i: -1 };
  }
}
function payBadge(o) {

  if (p.status === 'pagado') return '<span class="badge ok">Pagado</span>';

}

function openSheet(html, onOpen) {
  const r = $('#sheet-root'); clearTimeout(closeT);
  const was = r.classList.contains('open');
  r.innerHTML = `<div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  document.body.classList.add('lock');
  if (!was) requestAnimationFrame(() => requestAnimationFrame(() => r.classList.add('open')));
  if (onOpen) onOpen();
}
function closeSheet() {
  const r = $('#sheet-root'); r.classList.remove('open'); document.body.classList.remove('lock');
  clearTimeout(closeT); closeT = setTimeout(() => { if (!r.classList.contains('open')) r.innerHTML = ''; }, 320);
}

  sugT = setTimeout(async () => {
    try {
      const r = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&accept-language=es&q=' + encodeURIComponent(q));
      sugN = await r.json();
      const b = $('#a-sug'); if (b) b.innerHTML = sugN.map((s, i) => `<button type="button" data-act="sug" data-i="${i}">📍 ${esc(short(s.display_name))}</button>`).join('');
    } catch { const b = $('#a-sug'); if (b) b.innerHTML = ''; }
  }, 700);
}

function openCheckout() {
  if (!cartCount()) return;
  if (!state.address) { state.returnToCheckout = true; toast('Primero dinos dónde entregar'); openAddress(); return; }
  const b = biz(state.cart.bizId);
  openSheet(`
    <div class="sheet-h"><h2>Tu pedido</h2><button class="icon-btn" data-act="close" aria-label="Cerrar">✕</button></div>
    <div class="meta"><span>${b.emoji} ${esc(b.name)}</span><span>${esc(b.eta)}</span></div>
    <div id="co-items"></div>
    <div class="co-addr"><span>📍</span><div><small>Entrega en</small><strong>${esc(state.address.text)}</strong>${state.address.ref ? `<small>${esc(state.address.ref)}</small>` : ''}</div><button class="link" data-act="addr">Cambiar</button></div>
    <label class="field">Notas para el local o el conductor<input id="co-notes" maxlength="140" placeholder="Ej: sin cebolla" value="${esc(state.notes)}"></label>
    <h3>Propina para el conductor</h3>
    <div class="tips" id="co-tips">${[0, 1000, 2000, 3000].map(v => `<button class="pill" data-act="tip" data-v="${v}">${v ? money(v) : 'No'}</button>`).join('')}</div>
    <h3>¿Cómo pagas?</h3>
    <div class="methods" id="co-methods">
      <button class="method" data-act="method" data-m="efectivo">💵 Efectivo<small>Pagas al recibir</small></button>
      <button class="method" data-act="method" data-m="transferencia">🏦 Transferencia<small>La haces al recibir</small></button>
      <button class="method wide" data-act="method" data-m="personalpay">📲 Personal Pay<small>Pagas con la app al recibir</small></button>
    </div>
    <p class="hint" id="co-hint"></p>
    <div id="pp-form" class="box hide"></div>
    <div id="cash-form" class="hide"><label class="field">¿Con cuánto pagas? <i>(opcional, para llevarte el cambio)</i><input id="co-cash" inputmode="decimal" placeholder="Ej: 20000"></label></div>
    <div id="co-totals"></div>
    <button class="btn primary big" id="co-pay" data-act="place">Pedir ya</button>
    <p class="secure" id="co-secure"></p>`,
    () => { $('#co-notes').addEventListener('input', e => state.notes = e.target.value); drawCo(); });
}
function drawCo() {
  if (!$('#co-items')) return;
  const lines = cartLines();
  if (!lines.length) { closeSheet(); renderDock(); return; }
  $('#co-items').innerHTML = lines.map(l => `<div class="line"><div class="tx"><b>${esc(l.name)}</b><div class="meta"><span>${money(l.price)}</span></div></div><div class="qty"><button data-act="co-dec" data-id="${l.id}" aria-label="Quitar uno">−</button><span>${l.qty}</span><button data-act="co-add" data-id="${l.id}" aria-label="Agregar uno">+</button></div></div>`).join('');
  const t = totals();
  $('#co-totals').innerHTML = `
    <div class="tot"><span>Productos</span><span>${money(t.subtotal)}</span></div>
    <div class="tot"><span>Envío</span><span>${money(t.fee)}</span></div>
    <div class="tot"><span>Servicio</span><span>${money(t.service)}</span></div>
    <div class="tot"><span>Propina</span><span>${money(t.tip)}</span></div>
    <div class="tot big"><span>Total</span><span>${money(t.total)}</span></div>`;
  $('#co-pay').textContent = `Pedir ya · ${money(t.total)}`;
  $$('#co-tips .pill').forEach(p => p.classList.toggle('on', +p.dataset.v === state.tip));
  $$('#co-methods .method').forEach(m => m.classList.toggle('on', m.dataset.m === state.method));
  $('#cash-form').classList.toggle('hide', state.method !== 'efectivo');
  const pp = CONFIG.PERSONAL_PAY || {}, isPP = state.method === 'personalpay';
  $('#pp-form').classList.toggle('hide', !isPP);
  if (isPP) $('#pp-form').innerHTML = `<small class="meta">Al recibir tu pedido, paga ${money(t.total)} por Personal Pay a:</small>` +
    (pp.ALIAS ? `<div class="pp-al"><b>${esc(pp.ALIAS)}</b><button class="btn ghost" data-act="copy-alias">Copiar</button></div>${pp.TITULAR ? `<small class="meta">${esc(pp.TITULAR)}</small>` : ''}`
              : '<div class="pp-al"><b>Los datos te los pasa el conductor</b></div>');
  $('#co-hint').textContent = isPP ? 'El pedido queda pendiente de pago hasta que el conductor confirme que le llegó.' : 'El pago se hace en mano, cara a cara con el repartidor.';
  $('#co-secure').textContent = 'Coordinas el pago directo con el repartidor.';
}

function showPay(title, sub, ok) {
  const p = $('#pay'); p.classList.add('on');
  $('#pay-i').className = ok ? 'okk' : 'spin'; $('#pay-i').textContent = ok ? '✓' : '';
  $('#pay-t').textContent = title; $('#pay-s').textContent = sub || '';
}
const hidePay = () => $('#pay').classList.remove('on');

async function placeOrder() {
  if (placing) return;
  const lines = cartLines(); if (!lines.length) return;
  if (!state.address) { state.returnToCheckout = true; openAddress(); return; }
  const b = biz(state.cart.bizId), t = totals();
  const payment = { method: state.method, status: 'pendiente' };
  if (state.method === 'efectivo') {
    const raw = ($('#co-cash').value || '').replace(',', '.'), cash = raw ? Number(raw) : 0;
    if (raw && (!isFinite(cash) || cash < t.total)) { toast(`El monto debe cubrir el total (${money(t.total)})`, 'err'); return; }
    if (cash) payment.cashWith = cash;
  }
  placing = true; showPay('Enviando tu pedido…', '');
  const now = Date.now(), id = 'o' + now.toString(36) + rid();
  const order = {
    id, status: 'nuevo', createdAt: now, updatedAt: now, t_nuevo: now,
    customer: { id: state.user.id, name: state.user.name, phone: state.user.phone || '' },
    business: { id: b.id, name: b.name, emoji: b.emoji },
    items: lines.map(l => ({ name: l.name, qty: l.qty, price: l.price })),
    address: { text: state.address.text, ref: state.address.ref || '', ...(state.address.lat ? { lat: state.address.lat, lon: state.address.lon } : {}) },
    notes: state.notes.trim(), totals: t, driverPay: +(t.fee + t.tip).toFixed(2), payment
  };
  try { await Sync.patch('orders', id, order); }
  catch { placing = false; hidePay(); toast('No pudimos enviar tu pedido. Revisa tu conexión.', 'err'); return; }
  placing = false; state.cart = { bizId: null, items: {} }; state.notes = '';
  hidePay(); closeSheet(); go('track', id);
}

/* ═══════════════ ACCIONES ═══════════════ */
const A = {
  close: () => closeSheet(),
  back: () => go('home'),
  addr: () => { if ($('#co-items')) state.returnToCheckout = true; openAddress(); },
  user: () => openSheet(`
    <div class="sheet-h"><h2>Hola, ${esc(state.user.name)}</h2><button class="icon-btn" data-act="close" aria-label="Cerrar">✕</button></div>
    ${state.user.phone ? `<p class="sub">${esc(state.user.phone)}</p>` : ''}
    <button class="btn ghost big" data-act="orders" style="margin-bottom:10px">Mis pedidos</button>
    <button class="btn ghost big" data-act="logout">Cerrar sesión</button>`),
  orders: () => { closeSheet(); go('orders'); },
  logout: () => { if (activeOrder() && !confirm('Tienes un pedido en curso. ¿Cerrar sesión igual?')) return; store.del('rcg:customer'); state.user = null; state.cart = { bizId: null, items: {} }; state.view = 'home'; closeSheet(); render(); },
  'copy-alias': () => {
    const a = (CONFIG.PERSONAL_PAY || {}).ALIAS || '';
    try { navigator.clipboard.writeText(a).then(() => toast('Alias copiado'), () => toast('No pudimos copiar. Cópialo a mano.', 'err')); }
    catch { toast('No pudimos copiar. Cópialo a mano.', 'err'); }
  },
  cat: t => { state.cat = t.dataset.cat; $$('.chip').forEach(c => c.classList.toggle('on', c.dataset.cat === state.cat)); drawBiz(); },
  'open-biz': t => { state.bizId = t.dataset.id; go('biz'); },
  add: t => { if (addItem(state.bizId, t.dataset.id, 1)) { refreshCtls(); renderDock(); } },
  dec: t => { addItem(state.bizId, t.dataset.id, -1); refreshCtls(); renderDock(); },
  'co-add': t => { addItem(state.cart.bizId, t.dataset.id, 1); drawCo(); refreshCtls(); renderDock(); },
  'co-dec': t => { addItem(state.cart.bizId, t.dataset.id, -1); drawCo(); refreshCtls(); renderDock(); },
  cart: () => openCheckout(),
  tip: t => { state.tip = +t.dataset.v; drawCo(); },
  method: t => { state.method = t.dataset.m; drawCo(); },
  place: () => placeOrder(),
  track: t => { closeSheet(); go('track', t.dataset.id); },
  'pick-saved': t => { const a = state.saved[+t.dataset.i]; if (!a) return; $('#a-text').value = a.text; $('#a-ref').value = a.ref || ''; geo = a.lat ? { lat: a.lat, lon: a.lon } : null; $('#a-sug').innerHTML = ''; },
  sug: t => { const s = sugN[+t.dataset.i]; if (!s) return; $('#a-text').value = short(s.display_name); geo = { lat: +s.lat, lon: +s.lon }; $('#a-sug').innerHTML = ''; },
  'use-loc': t => {
    if (!navigator.geolocation) { toast('Tu navegador no permite usar la ubicación', 'err'); return; }
    const label = t.textContent; t.textContent = 'Buscando tu ubicación…';
    navigator.geolocation.getCurrentPosition(async p => {
      geo = { lat: p.coords.latitude, lon: p.coords.longitude };
      let txt = `${geo.lat.toFixed(5)}, ${geo.lon.toFixed(5)}`;
      try { const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&accept-language=es&lat=${geo.lat}&lon=${geo.lon}`); const j = await r.json(); if (j.display_name) txt = short(j.display_name); } catch {}
      const i = $('#a-text'); if (i) i.value = txt; t.textContent = label;
    }, () => { t.textContent = label; toast('No pudimos obtener tu ubicación. Escribe tu dirección.', 'err'); }, { enableHighAccuracy: true, timeout: 10000 });
  },
  'save-addr': () => {
    const text = $('#a-text').value.trim();
    if (text.length < 5) { toast('Escribe tu dirección completa', 'err'); return; }
    state.address = { text, ref: $('#a-ref').value.trim(), ...(geo || {}) };
    store.set('rcg:address', state.address);
    state.saved = [state.address, ...state.saved.filter(a => a.text !== text)].slice(0, 4);
    store.set('rcg:addresses', state.saved);
    closeSheet(); render();
    if (state.returnToCheckout) { state.returnToCheckout = false; setTimeout(openCheckout, 340); }
  },
  cancel: async t => {
    await Sync.refresh('orders');
    const o = Sync.get('orders', t.dataset.id);
    if (!o || o.status !== 'nuevo') { toast('Un conductor ya aceptó tu pedido; ya no se puede cancelar', 'err'); return; }
    if (!confirm('¿Cancelar este pedido?')) return;
    const now = Date.now(), p = { status: 'cancelado', updatedAt: now, t_cancelado: now, cancelledBy: 'cliente' };
    try { await Sync.patch('orders', o.id, p); toast('Pedido cancelado'); } catch { toast('No pudimos cancelar. Intenta de nuevo.', 'err'); }
  }
};
document.addEventListener('click', e => { const t = e.target.closest('[data-act]'); if (!t) return; const f = A[t.dataset.act]; if (f) f(t, e); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#sheet-root').classList.contains('open')) closeSheet(); });
document.addEventListener('input', e => { if (e.target.id === 'q') { state.q = e.target.value; drawBiz(); } });
document.addEventListener('submit', e => {
  if (e.target.id !== 'login-form') return;
  e.preventDefault();
  const name = $('#l-name').value.trim().replace(/\s+/g, ' '), phone = $('#l-phone').value.trim();
  if (!name) return;
  state.user = { id: 'c' + hash(name.toLowerCase() + '|' + phone), name, phone };
  store.set('rcg:customer', state.user);
  render();
  if (!state.address) setTimeout(openAddress, 250);
});

/* ═══════════════ TIEMPO REAL ═══════════════ */
function onOrders(data) {
  state.orders = data || {};
  if (!state.user) return;
  mine().forEach(o => {
    const p = prev[o.id];
    if (p && p !== o.status) { toast(statusInfo(o).t); if (navigator.vibrate) navigator.vibrate(200); }
    prev[o.id] = o.status;
  });
  if (state.view === 'track') renderTrack(); else if (state.view === 'orders') renderOrders();
  renderDock();
}
function onDrivers(data) { state.drivers = data || {}; updateLive(); if (state.view === 'track') renderTrack(); }

Sync.subscribe('orders', onOrders);
Sync.subscribe('drivers', onDrivers);
Sync.onStatus(updateChip);
Sync.start();
setInterval(() => { updateLive(); }, 10000);
addEventListener('online', () => toast('Conexión recuperada'));
addEventListener('offline', () => toast('Sin conexión a internet', 'err'));
render();
})();
</script>
</body>
</html>
