<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ringcon Go - Panel de Conductores</title>
    <!-- Fuente Inter para acabado profesional -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #334155;
            --border-color: #475569;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --accent-green: #10b981;
            --accent-green-hover: #059669;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- Pantalla de Registro / Login --- */
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 32px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        .brand-title span {
            color: var(--primary);
        }

        .brand-subtitle {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .input-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-field label {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        .input-field input {
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-field input:focus {
            border-color: var(--primary);
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 8px;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        /* --- Panel Principal --- */
        .dashboard-container {
            width: 100%;
            max-width: 800px;
            padding: 24px 16px;
            display: none;
        }

        header.dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px 24px;
            margin-bottom: 24px;
        }

        .driver-info h2 {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .driver-info p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .btn-logout {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-logout:hover {
            background-color: var(--danger);
            color: white;
            border-color: var(--danger);
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .orders-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .order-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .order-id {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .badge-pending {
            background-color: rgba(245, 158, 11, 0.1);
            color: #f59e0b;
            border: 1px solid rgba(245, 158, 11, 0.3);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .order-details {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .btn-action {
            background-color: var(--accent-green);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 10px 16px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            align-self: flex-start;
            transition: background-color 0.2s;
        }

        .btn-action:hover {
            background-color: var(--accent-green-hover);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            background-color: var(--bg-card);
            border: 1px dashed var(--border-color);
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <!-- Vista 1: Formulario de Registro / Ingreso -->
    <div id="auth-screen" class="auth-container">
        <div class="auth-card">
            <div class="brand-header">
                <h1 class="brand-title">Ringcon <span>Go</span></h1>
                <p class="brand-subtitle">Portal de Conducción y Entregas</p>
            </div>
            <form id="form-login" class="form-group" onsubmit="event.preventDefault();">
                <div class="input-field">
                    <label for="input-nombre">Nombre Completo</label>
                    <input type="text" id="input-nombre" placeholder="Ej. Juan Pérez" required>
                </div>
                <div class="input-field">
                    <label for="input-direccion">Dirección / Base Operativa</label>
                    <input type="text" id="input-direccion" placeholder="Ej. Av. Central 1234" required>
                </div>
                <button type="button" id="btn-ingresar" class="btn-primary">Acceder al Panel</button>
            </form>
        </div>
    </div>

    <!-- Vista 2: Dashboard de Pedidos -->
    <div id="dashboard-screen" class="dashboard-container">
        <header class="dashboard-header">
            <div class="driver-info">
                <h2 id="driver-name-display">Cargando...</h2>
                <p id="driver-address-display">---</p>
            </div>
            <button id="btn-logout" class="btn-logout">Cerrar Sesión</button>
        </header>

        <main>
            <h2 class="section-title">Pedidos Disponibles</h2>
            <div id="lista-pedidos" class="orders-grid">
                <div class="empty-state">Buscando nuevos pedidos en tiempo real...</div>
            </div>
        </main>
    </div>

    <!-- Firebase SDK (Módulos Oficiales) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Configuración de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDKrQcRn5zbW9VD1GBsgdAh6U1bOG...",
            authDomain: "ringcon-go.firebaseapp.com",
            projectId: "ringcon-go",
            storageBucket: "ringcon-go.firebasestorage.app",
            messagingSenderId: "868935005608",
            appId: "1:868935005608:web:82b9d581ffeaf689f2d99d",
            measurementId: "G-E628RBVYP"
        };

        // Inicialización de servicios
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Referencias del DOM
        const authScreen = document.getElementById('auth-screen');
        const dashboardScreen = document.getElementById('dashboard-screen');
        const btnIngresar = document.getElementById('btn-ingresar');
        const btnLogout = document.getElementById('btn-logout');
        const inputNombre = document.getElementById('input-nombre');
        const inputDireccion = document.getElementById('input-direccion');
        const driverNameDisplay = document.getElementById('driver-name-display');
        const driverAddressDisplay = document.getElementById('driver-address-display');
        const listaPedidos = document.getElementById('lista-pedidos');

        let unsubscribeOrders = null;

        // Comprobar si hay sesión guardada en localStorage
        const sessionGuardada = localStorage.getItem('ringcon_driver_session');
        if (sessionGuardada) {
            const datosConductor = JSON.parse(sessionGuardada);
            iniciarSesion(datosConductor);
        }

        // Evento de ingreso
        btnIngresar.addEventListener('click', () => {
            const nombre = inputNombre.value.trim();
            const direccion = inputDireccion.value.trim();

            if (!nombre || !direccion) {
                alert("Por favor, completa ambos campos para continuar.");
                return;
            }

            const datosConductor = { nombre, direccion };
            localStorage.setItem('ringcon_driver_session', JSON.stringify(datosConductor));
            iniciarSesion(datosConductor);
        });

        // Evento de cierre de sesión
        btnLogout.addEventListener('click', () => {
            localStorage.removeItem('ringcon_driver_session');
            if (unsubscribeOrders) unsubscribeOrders();
            dashboardScreen.style.display = 'none';
            authScreen.style.display = 'flex';
        });

        // Función para cambiar de vista e iniciar escuchas
        function iniciarSesion(datos) {
            authScreen.style.display = 'none';
            dashboardScreen.style.display = 'block';

            driverNameDisplay.textContent = datos.nombre;
            driverAddressDisplay.textContent = datos.direccion;

            escucharPedidosFirestore();
        }

        // Escuchar la colección 'ordenes' en vivo
        function escucharPedidosFirestore() {
            const q = query(collection(db, "ordenes"), where("estado", "==", "PENDIENTE"));

            unsubscribeOrders = onSnapshot(q, (querySnapshot) => {
                listaPedidos.innerHTML = "";

                if (querySnapshot.empty) {
                    listaPedidos.innerHTML = '<div class="empty-state">No hay pedidos pendientes disponibles en este momento.</div>';
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const pedido = docSnap.data();
                    const idPedido = docSnap.id;

                    const card = document.createElement("div");
                    card.className = "order-card";
                    card.innerHTML = `
                        <div class="order-header">
                            <span class="order-id">Orden #${idPedido.substring(0, 8)}</span>
                            <span class="badge-pending">PENDIENTE</span>
                        </div>
                        <div class="order-details">
                            <p><strong>Detalle:</strong> ${pedido.descripcion || "Sin descripción"}</p>
                            <p><strong>Destino:</strong> ${pedido.direccion || "No especificada"}</p>
                        </div>
                        <button class="btn-action" onclick="aceptarPedido('${idPedido}')">Tomar Pedido</button>
                    `;
                    listaPedidos.appendChild(card);
                });
            }, (error) => {
                console.error("Error al escuchar la base de datos:", error);
                listaPedidos.innerHTML = '<div class="empty-state">Error al conectar con la base de datos.</div>';
            });
        }

        // Función global para actualizar el estado del pedido
        window.aceptarPedido = async function(idPedido) {
            try {
                const orderRef = doc(db, "ordenes", idPedido);
                await updateDoc(orderRef, { 
                    estado: "EN_CAMINO",
                    conductor: driverNameDisplay.textContent
                });
            } catch (e) {
                console.error("Error al actualizar la orden:", e);
                alert("No se pudo asignar el pedido. Inténtalo de nuevo.");
            }
        };
    </script>
</body>
</html>
