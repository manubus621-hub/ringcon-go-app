<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ringcon Go - Pedidos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #334155;
            --border-color: #475569;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --accent-green: #10b981;
            --accent-green-hover: #059669;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 32px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        .brand-title span {
            color: var(--primary);
        }

        .brand-subtitle {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .input-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-field label {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        .input-field input, .input-field textarea {
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-field input:focus, .input-field textarea:focus {
            border-color: var(--primary);
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 8px;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .dashboard-container {
            width: 100%;
            max-width: 800px;
            padding: 24px 16px;
            display: none;
        }

        header.dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px 24px;
            margin-bottom: 24px;
        }

        .client-info h2 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .client-info p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .btn-logout {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-logout:hover {
            background-color: var(--danger);
            color: white;
            border-color: var(--danger);
        }

        .card-box {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .orders-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .order-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .order-id {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .badge-pending {
            background-color: rgba(245, 158, 11, 0.1);
            color: #f59e0b;
            border: 1px solid rgba(245, 158, 11, 0.3);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge- camino {
            background-color: rgba(16, 185, 129, 0.1);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .order-details {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            background-color: var(--bg-card);
            border: 1px dashed var(--border-color);
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <!-- Pantalla de Ingreso del Cliente -->
    <div id="auth-screen" class="auth-container">
        <div class="auth-card">
            <div class="brand-header">
                <h1 class="brand-title">Ringcon <span>Go</span></h1>
                <p class="brand-subtitle">Haz tu pedido al instante</p>
            </div>
            <div class="form-group">
                <div class="input-field">
                    <label for="input-nombre">Tu Nombre</label>
                    <input type="text" id="input-nombre" placeholder="Ej. María Gómez">
                </div>
                <div class="input-field">
                    <label for="input-direccion">Dirección de Entrega</label>
                    <input type="text" id="input-direccion" placeholder="Ej. Calle Falsa 123">
                </div>
                <button type="button" id="btn-ingresar" class="btn-primary">Continuar</button>
            </div>
        </div>
    </div>

    <!-- Panel de Creación y Seguimiento de Pedidos -->
    <div id="dashboard-screen" class="dashboard-container">
        <header class="dashboard-header">
            <div class="client-info">
                <h2 id="client-name-display">Cliente</h2>
                <p id="client-address-display">Dirección</p>
            </div>
            <button id="btn-logout" class="btn-logout">Cambiar Datos</button>
        </header>

        <!-- Formulario para pedir -->
        <div class="card-box">
            <h2 class="section-title">Nuevo Pedido</h2>
            <div class="form-group">
                <div class="input-field">
                    <label for="input-descripcion">¿Qué quieres pedir o enviar?</label>
                    <textarea id="input-descripcion" rows="3" placeholder="Ej. 2 Hamburguesas completas y una gaseosa..."></textarea>
                </div>
                <button type="button" id="btn-crear-pedido" class="btn-primary" style="background-color: var(--accent-green);">Realizar Pedido</button>
            </div>
        </div>

        <main>
            <h2 class="section-title">Mis Pedidos Activos</h2>
            <div id="lista-pedidos" class="orders-grid">
                <div class="empty-state">No tienes pedidos activos en este momento.</div>
            </div>
        </main>
    </div>

    <!-- Scripts de Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, add슐 as addDoc, query, where, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        // Nota: importamos addDoc limpio abajo
        import { addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDKrQcRn5zbW9VD1GBsgdAh6U1bOG...",
            authDomain: "ringcon-go.firebaseapp.com",
            projectId: "ringcon-go",
            storageBucket: "ringcon-go.firebasestorage.app",
            messagingSenderId: "868935005608",
            appId: "1:868935005608:web:82b9d581ffeaf689f2d99d",
            measurementId: "G-E628RBVYP"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const authScreen = document.getElementById('auth-screen');
        const dashboardScreen = document.getElementById('dashboard-screen');
        const btnIngresar = document.getElementById('btn-ingresar');
        const btnLogout = document.getElementById('btn-logout');
        const btnCrearPedido = document.getElementById('btn-crear-pedido');
        const inputNombre = document.getElementById('input-nombre');
        const inputDireccion = document.getElementById('input-direccion');
        const inputDescripcion = document.getElementById('input-descripcion');
        const clientNameDisplay = document.getElementById('client-name-display');
        const clientAddressDisplay = document.getElementById('client-address-display');
        const listaPedidos = document.getElementById('lista-pedidos');

        let unsubscribeOrders = null;
        let clienteActual = null;

        // Comprobar sesión guardada
        const sessionGuardada = localStorage.getItem('ringcon_client_session');
        if (sessionGuardada) {
            try {
                clienteActual = JSON.parse(sessionGuardada);
                if (clienteActual && clienteActual.nombre) {
                    iniciarPanel(clienteActual);
                }
            } catch (e) {
                localStorage.removeItem('ringcon_client_session');
            }
        }

        btnIngresar.addEventListener('click', () => {
            const nombre = inputNombre.value.trim();
            const direccion = inputDireccion.value.trim();

            if (!nombre || !direccion) {
                alert("Por favor completa tu nombre y dirección.");
                return;
            }

            clienteActual = { nombre, direccion };
            localStorage.setItem('ringcon_client_session', JSON.stringify(clienteActual));
            iniciarPanel(clienteActual);
        });

        btnLogout.addEventListener('click', () => {
            localStorage.removeItem('ringcon_client_session');
            if (unsubscribeOrders) unsubscribeOrders();
            dashboardScreen.style.display = 'none';
            authScreen.style.display = 'flex';
            inputNombre.value = '';
            inputDireccion.value = '';
        });

        function iniciarPanel(datos) {
            authScreen.style.display = 'none';
            dashboardScreen.style.display = 'block';

            clientNameDisplay.textContent = datos.nombre;
            clientAddressDisplay.textContent = datos.direccion;

            escucharMisPedidos(datos.nombre);
        }

        // Crear pedido en Firestore
        btnCrearPedido.addEventListener('click', async () => {
            const descripcion = inputDescripcion.value.trim();
            if (!descripcion) {
                alert("Por favor escribe qué deseas pedir.");
                return;
            }

            try {
                await addDoc(collection(db, "ordenes"), {
                    cliente: clienteActual.nombre,
                    direccion: clienteActual.direccion,
                    descripcion: descripcion,
                    estado: "PENDIENTE",
                    createdAt: serverTimestamp()
                });

                inputDescripcion.value = "";
                alert("¡Pedido realizado con éxito!");
            } catch (e) {
                console.error("Error al crear pedido:", e);
                alert("No se pudo enviar el pedido. Revisa la consola.");
            }
        });

        // Escuchar los pedidos de este cliente en vivo
        function escucharMisPedidos(nombreCliente) {
            const q = query(collection(db, "ordenes"), where("cliente", "==", nombreCliente));

            unsubscribeOrders = onSnapshot(q, (querySnapshot) => {
                listaPedidos.innerHTML = "";

                if (querySnapshot.empty) {
                    listaPedidos.innerHTML = '<div class="empty-state">No tienes pedidos activos en este momento.</div>';
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const pedido = docSnap.data();
                    const idPedido = docSnap.id;
                    const estado = pedido.estado || "PENDIENTE";

                    const badgeClass = estado === "PENDIENTE" ? "badge-pending" : "badge-camino";
                    const badgeText = estado === "PENDIENTE" ? "PENDIENTE" : "EN CAMINO";

                    const card = document.createElement("div");
                    card.className = "order-card";
                    card.innerHTML = `
                        <div class="order-header">
                            <span class="order-id">Orden #${idPedido.substring(0, 8)}</span>
                            <span class="${badgeClass}">${badgeText}</span>
                        </div>
                        <div class="order-details">
                            <p><strong>Pedido:</strong> ${pedido.descripcion}</p>
                            <p><strong>Destino:</strong> ${pedido.direccion}</p>
                            ${pedido.conductor ? `<p style="margin-top: 6px; color: var(--accent-green);"><strong>Conductor:</strong> ${pedido.conductor}</p>` : ''}
                        </div>
                    `;
                    listaPedidos.appendChild(card);
                });
            }, (error) => {
                console.error("Error al escuchar pedidos:", error);
            });
        }
    </script>
</body>
</html>
