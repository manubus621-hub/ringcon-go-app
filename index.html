<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff3b1f">
<title>Ringcon Go Delivery · Pide ya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff;--ink:#141416;--mute:#75757d;--line:#ececf0;--soft:#f5f5f7;
  --brand:#ff3b1f;--brand-d:#e32d12;--ok:#12a863;--warn:#f08c00;--bad:#e5384b;
  --r:20px;--shadow:0 12px 32px -14px rgba(20,20,22,.3);
  --display:'Bricolage Grotesque',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font:16px/1.45 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:inherit}
h1,h2,h3,.logo{font-family:var(--display);letter-spacing:-.025em}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.logo{font-weight:800;font-size:24px;line-height:1}
.logo b{background:var(--brand);color:#fff;border-radius:9px;padding:1px 8px 3px;margin-left:4px;display:inline-block;transform:rotate(-5deg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:14px;font-weight:700;transition:transform .12s,background .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--brand);color:#fff;box-shadow:0 12px 24px -12px var(--brand)}
.btn.primary:hover{background:var(--brand-d)}
.btn.ghost{background:var(--soft)}
.btn.big{width:100%;padding:16px;font-size:17px;border-radius:16px}
.btn[disabled]{opacity:.5;pointer-events:none}
.icon-btn{width:40px;height:40px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:18px;flex:none}
.link{color:var(--brand);font-weight:700}
.hide{display:none!important}

/* login */
.login{min-height:100dvh;display:grid}
.login-art{background:var(--brand);display:grid;place-items:center;min-height:34vh;position:relative;overflow:hidden}
.login-art::before,.login-art::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.13)}
.login-art::before{width:380px;height:380px;top:-130px;left:-110px}
.login-art::after{width:260px;height:260px;bottom:-90px;right:-60px}
.login-art span{font-size:110px;position:relative;animation:bob 2.6s ease-in-out infinite;filter:drop-shadow(0 18px 16px rgba(0,0,0,.25))}
@keyframes bob{50%{transform:translateY(-12px) rotate(-3deg)}}
.login-box{padding:28px 24px 40px;max-width:460px;width:100%;margin:0 auto;align-self:center}
.login-box h1{font-size:clamp(44px,9vw,64px);line-height:.98;margin:22px 0 12px;font-weight:800}
.sub{color:var(--mute);margin-bottom:24px}
@media(min-width:860px){.login{grid-template-columns:1.1fr 1fr}.login-art{min-height:100dvh}.login-art span{font-size:210px}}
.field{display:block;margin-bottom:14px;font-size:13px;font-weight:600;color:var(--mute)}
.field i{font-weight:400;font-style:normal}
.field input{display:block;width:100%;margin-top:6px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--soft);font-size:16px;outline:0;transition:border-color .2s,background .2s}
.field input:focus{border-color:var(--ink);background:#fff}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12px;color:var(--mute);margin:-4px 0 12px}

/* header */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.top .logo{font-size:19px}
.top-title{flex:1;font-family:var(--display);font-size:18px}
.addr{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;padding:6px 14px;border-radius:14px;background:var(--soft)}
.addr>span:nth-child(2){min-width:0;flex:1}
.addr small{display:block;font-size:11px;color:var(--mute);font-weight:600}
.addr strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--ink);color:#fff;font-weight:800;font-family:var(--display);flex:none}
@media(max-width:520px){.top .logo{display:none}}

/* home */
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 150px}
.wrap.narrow{max-width:680px}
.hello{color:var(--mute);font-weight:600}
.hello b{color:var(--ink)}
.hero h1{font-size:clamp(34px,7vw,64px);font-weight:800;line-height:1;margin:8px 0 18px;max-width:14ch}
.search{position:relative}
.search::before{content:'🔎';position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:16px}
.search input{width:100%;padding:16px 18px 16px 46px;border-radius:16px;border:1.5px solid var(--line);background:var(--soft);outline:0;font-size:16px}
.search input:focus{border-color:var(--ink);background:#fff}
.livep{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14px;font-weight:600;color:var(--mute)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);display:inline-block;position:relative;flex:none}
.dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--ok);animation:ping 1.6s infinite}
@keyframes ping{to{transform:scale(3.2);opacity:0}}
.dot.off{background:#bdbdc4}.dot.off::after{display:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:16px 0 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 16px;border-radius:999px;background:var(--soft);font-weight:700;font-size:14px}
.chip.on{background:var(--ink);color:#fff}
.promo{display:flex;gap:14px;align-items:center;padding:18px;border-radius:var(--r);background:var(--brand);color:#fff;margin:18px 0 0;width:100%;text-align:left}
.promo .em{font-size:34px}
.promo b{display:block;font-family:var(--display);font-size:20px;line-height:1.1}
.promo small{opacity:.85}
.promo .go{margin-left:auto;background:#fff;color:var(--brand);border-radius:12px;padding:9px 14px;font-weight:800;flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{text-align:left;border-radius:var(--r);overflow:hidden;background:#fff;border:1px solid var(--line);transition:transform .2s,box-shadow .2s;display:block;width:100%}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.tile{height:128px;display:grid;place-items:center;font-size:62px;background:var(--tile)}
.card-b{padding:14px 16px 16px}
.card-b h3{font-size:19px;font-weight:800}
.meta{display:flex;flex-wrap:wrap;gap:2px 12px;color:var(--mute);font-size:14px;margin-top:4px}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:40px 0}
.foot{text-align:center;color:var(--mute);font-size:12px;padding:34px 0 0}

/* business */
.biz-hero{height:190px;border-radius:var(--r);background:var(--tile);display:grid;place-items:center;font-size:96px;margin-bottom:16px}
.biz-name{font-size:36px;font-weight:800;line-height:1.05}
.menu{margin-top:14px}
.item{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.item .em{font-size:32px;width:60px;height:60px;border-radius:16px;background:var(--soft);display:grid;place-items:center;flex:none}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block}
.item .tx small{color:var(--mute);display:block;font-size:13px}
.item .pr{font-weight:800;margin-top:2px;display:block}
.add{width:38px;height:38px;border-radius:50%;background:var(--brand);color:#fff;font-size:22px;font-weight:700;line-height:1}
.qty{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:999px;padding:3px}
.qty button{width:32px;height:32px;border-radius:50%;background:#fff;font-weight:800;font-size:18px;box-shadow:0 1px 3px rgba(0,0,0,.14)}
.qty span{min-width:18px;text-align:center;font-weight:800}

/* dock */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));max-width:680px;margin:0 auto;pointer-events:none}
#dock>*{pointer-events:auto}
.bar{display:flex;align-items:center;gap:12px;padding:15px 18px;border-radius:18px;font-weight:800;box-shadow:var(--shadow);width:100%;text-align:left}
.bar.cart{background:var(--brand);color:#fff;justify-content:space-between}
.bar.cart .n{background:rgba(255,255,255,.25);border-radius:10px;padding:2px 10px}
.bar.trk{background:var(--ink);color:#fff}
.bar.trk small{display:block;font-weight:500;opacity:.7}
.bar.trk .go{margin-left:auto;background:var(--brand);border-radius:10px;padding:6px 12px}

/* sheet */
#sheet-root{position:fixed;inset:0;z-index:50;pointer-events:none}
#sheet-root.open{pointer-events:auto}
.scrim{position:absolute;inset:0;background:rgba(10,10,14,.5);opacity:0;transition:opacity .25s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92dvh;overflow:auto;background:#fff;border-radius:26px 26px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-width:560px;margin:0 auto}
#sheet-root.open .scrim{opacity:1}
#sheet-root.open .sheet{transform:none}
@media(min-width:700px){.sheet{bottom:auto;top:50%;border-radius:26px;transform:translateY(-40%) scale(.97);opacity:0;max-height:88dvh;transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .2s}#sheet-root.open .sheet{transform:translateY(-50%);opacity:1}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:12px}
.sheet-h h2{font-size:26px;font-weight:800;line-height:1.05}
.sheet h3{font-size:15px;margin:20px 0 8px}
.line{display:flex;align-items:center;gap:12px;padding:10px 0}
.line .tx{flex:1;min-width:0}
.co-addr{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--soft);margin:8px 0 14px}
.co-addr>div{flex:1;min-width:0}
.co-addr small{display:block;color:var(--mute);font-size:12px;font-weight:600}
.co-addr strong{display:block;font-size:14px}
.tips{display:flex;gap:8px;flex-wrap:wrap}
.pill{padding:10px 16px;border-radius:12px;background:var(--soft);font-weight:700;border:1.5px solid transparent}
.pill.on{border-color:var(--ink);background:#fff}
.methods{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.method{padding:14px;border-radius:16px;border:1.5px solid var(--line);text-align:left;font-weight:700}
.method.on{border-color:var(--brand);background:#fff5f3}
.method small{display:block;font-weight:500;color:var(--mute)}
.tot{display:flex;justify-content:space-between;padding:4px 0;color:var(--mute)}
.tot.big{color:var(--ink);font-weight:800;font-size:20px;padding-top:12px;margin:8px 0 16px;border-top:1px dashed var(--line)}
.secure{text-align:center;color:var(--mute);font-size:12px;margin-top:12px}
.sug{display:grid;gap:4px;margin:-6px 0 12px}
.sug button{text-align:left;padding:10px 12px;border-radius:12px;background:var(--soft);font-size:14px}
.saved{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.saved .pill{font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* pago */
#pay{position:fixed;inset:0;z-index:80;background:rgba(255,255,255,.97);display:none;place-items:center;text-align:center;padding:24px}
#pay.on{display:grid}
.spin{width:64px;height:64px;border-radius:50%;border:6px solid var(--line);border-top-color:var(--brand);animation:sp .8s linear infinite;margin:0 auto 18px}
@keyframes sp{to{transform:rotate(360deg)}}
.okk{width:72px;height:72px;border-radius:50%;background:var(--ok);color:#fff;font-size:38px;display:grid;place-items:center;margin:0 auto 18px;animation:pop .4s}
@keyframes pop{from{transform:scale(.3)}}
#pay h2{font-size:26px}

/* tracking */
.t-head{padding:20px;border-radius:var(--r);background:var(--ink);color:#fff;margin-bottom:18px}
.t-head small{opacity:.7;display:block}
.t-head h1{font-size:30px;line-height:1.05;margin:8px 0 6px;font-weight:800}
.steps{margin:6px 0 18px}
.step{display:flex;gap:14px;align-items:flex-start;position:relative;padding-bottom:18px;color:var(--mute)}
.step::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--line)}
.step:last-child::before{display:none}
.step i{width:24px;height:24px;border-radius:50%;background:var(--line);flex:none;display:grid;place-items:center;font-style:normal;font-size:13px;color:#fff;z-index:1}
.step.done{color:var(--ink)}.step.done i{background:var(--ok)}.step.done::before{background:var(--ok)}
.step.now{color:var(--ink);font-weight:700}.step.now i{background:var(--brand);box-shadow:0 0 0 6px rgba(255,59,31,.18)}
.box{padding:16px;border-radius:var(--r);background:var(--soft);margin-bottom:14px}
.box.livep{margin-top:0}
.ord{display:block;width:100%;text-align:left}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:800}
.badge.ok{background:#dff6ea;color:#0b7a46}.badge.wait{background:#fff0d2;color:#955700}.badge.bad{background:#fde3e6;color:#b4232f}
.drv{display:flex;align-items:center;gap:14px}
.drv .av{width:48px;height:48px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;font-family:var(--display);font-size:20px}
.drv div{flex:1}
.drv small{color:var(--mute);display:block}
#toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-140%);z-index:90;background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;transition:transform .3s;max-width:92vw;box-shadow:var(--shadow)}
#toast.on{transform:translate(-50%,0)}
#toast.err{background:var(--bad)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="dock"></div>
<div id="sheet-root"></div>
<div id="pay"><div><div class="spin" id="pay-i"></div><h2 id="pay-t"></h2><p class="sub" id="pay-s"></p></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="app-rincon-go.js"></script>
</body>
</html>
