name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Android APK
        uses: pwa-builder/pwabuilder-action@v1.1
        with:
          url: 'https://ringcon-go.vercel.app'
          output-dir: 'android-app'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ringcon-go-apk
          path: android-app/
